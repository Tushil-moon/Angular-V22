name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prisma-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecommerce_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecommerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test
      JWT_ACCESS_SECRET: test-access-secret-min-32-characters!!
      JWT_REFRESH_SECRET: test-refresh-secret-min-32-characters!
      JWT_EMAIL_SECRET: test-email-secret-min-32-characters-xx
      JWT_PASSWORD_RESET_SECRET: test-reset-secret-min-32-characters-x
      ADMIN_PASSWORD: Admin@123456
      REDIS_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: prisma-backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npm test -- --passWithNoTests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular-v22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: angular-v22/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
